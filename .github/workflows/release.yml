name: Create GitHub Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-windows:
    uses: ./.github/workflows/windows-playable-build.yml

  build-linux:
    uses: ./.github/workflows/linux.yml
    with:
      build-mode: release
      upload-build-for-next-job: true

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: release-files
          pattern: '{release-asset-linux-*,SkyrimTogether-*}'
          merge-multiple: true

      - name: Verify release assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected_assets=(
            "SkyrimTogether-${version}-windows-x64.zip"
            "SkyrimTogether-${version}-windows-x64-debug-symbols.zip"
            "SkyrimTogetherServer-${version}-linux-amd64.tar.gz"
            "SkyrimTogetherServer-${version}-linux-arm64.tar.gz"
          )

          for asset in "${expected_assets[@]}"; do
            test -f "release-files/$asset"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            ./release-files/* \
            --verify-tag \
            --generate-notes \
            --title "Skyrim Together $version"
