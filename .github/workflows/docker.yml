name: Docker build

on:
  workflow_dispatch:
  schedule:
    # Every Friday at 1:00 p.m. UTC
    - cron: '0 13 * * 5'
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'

jobs:
  prepare:
    if: ${{ github.repository_owner == 'tiltedphoques' || github.event_name != 'schedule' }} # Disable cron runs in forks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # We need full history in order to create a version string (BuildInfo.h)
          fetch-depth: 0

      - name: Get version
        id: version
        run: echo "version=$(git describe --tags)" >> $GITHUB_OUTPUT

  docker:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          # We need full history in order to create a version string (BuildInfo.h)
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive --depth=1

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # (Release/Weekly) Build the server for both x86_64 and arm64 platforms, no push
      - name: Build image and export
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/st-reborn-server,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=Skyrim Together Server
            org.opencontainers.image.description=Dedicated server for the Skyrim Together multiplayer mod
            org.opencontainers.image.url=https://skyrim-together.com
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "${digest#sha256:}" > "/tmp/digests/${{ matrix.arch }}"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: [prepare, docker]
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Extract digests
        id: digests
        run: |
          echo "amd64=$(cat /tmp/digests/amd64)" >> $GITHUB_OUTPUT
          echo "arm64=$(cat /tmp/digests/arm64)" >> $GITHUB_OUTPUT

      - name: Build and push release image
        if: github.ref_type == 'tag'
        run: |
          docker buildx imagetools create \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/st-reborn-server:${{ needs.prepare.outputs.version }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/st-reborn-server:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/st-reborn-server@sha256:${{ steps.digests.outputs.amd64 }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/st-reborn-server@sha256:${{ steps.digests.outputs.arm64 }}

      - name: Build and push weekly image
        if: github.event_name == 'schedule'
        run: |
          docker buildx imagetools create \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/st-reborn-server:weekly-latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/st-reborn-server@sha256:${{ steps.digests.outputs.amd64 }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/st-reborn-server@sha256:${{ steps.digests.outputs.arm64 }}
