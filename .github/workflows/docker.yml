name: Docker build

on:
  workflow_dispatch:
  schedule:
    # Every Friday at 1:00 p.m. UTC
    - cron: '0 13 * * 5'
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # We need full history in order to create a version string (BuildInfo.h)
          fetch-depth: 0

      - name: Get version
        id: version
        run: echo "version=$(git describe --tags)" >> $GITHUB_OUTPUT

  docker:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # We need full history in order to create a version string (BuildInfo.h)
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive --depth=1

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # (Release/Weekly) Build the server for both x86_64 and arm64 platforms, no push
      - name: Build image and export
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=docker,dest=/tmp/image-${{ matrix.arch }}.tar
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/st-reborn-server:${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=Skyrim Together Server
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: /tmp/image-${{ matrix.arch }}.tar

  manifest:
    needs: [prepare, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Load images to local daemon
        run: |
          docker load --input image-amd64/image-amd64.tar
          docker load --input image-arm64/image-arm64.tar

      - name: Build and push release image
        if: github.ref_type == 'tag'
        run: |
          docker buildx imagetools create \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/st-reborn-server:${{ needs.prepare.outputs.version }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/st-reborn-server:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/st-reborn-server:amd64 \
            ${{ secrets.DOCKERHUB_USERNAME }}/st-reborn-server:arm64

      - name: Build and push weekly image
        if: github.event_name == 'schedule'
        run: |
          docker buildx imagetools create \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/st-reborn-server:weekly-latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/st-reborn-server:amd64 \
            ${{ secrets.DOCKERHUB_USERNAME }}/st-reborn-server:arm64