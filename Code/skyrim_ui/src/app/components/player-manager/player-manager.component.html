<div class="tab-buttons">
  <button
    data-style-ornament="inverted"
    [attr.data-style-active]="
      (activeTab$ | async) === PlayerManagerTab.PLAYER_LIST
    "
    (click)="switchTab(PlayerManagerTab.PLAYER_LIST)"
  >
    {{ 'COMPONENT.PLAYER_MANAGER.PLAYER_LIST' | transloco }}
  </button>
  <button
    data-style-ornament="inverted"
    [attr.data-style-active]="
      (activeTab$ | async) === PlayerManagerTab.PARTY_MENU
    "
    (click)="switchTab(PlayerManagerTab.PARTY_MENU)"
  >
    {{ 'COMPONENT.PLAYER_MANAGER.PARTY_MENU' | transloco }}
  </button>
</div>

<hr />

@switch (activeTab$ | async) {
  @case (PlayerManagerTab.PLAYER_LIST) {
    <app-player-list></app-player-list>
  }
  @case (PlayerManagerTab.PARTY_MENU) {
    <app-party-menu></app-party-menu>
  }
}

<hr />

<div class="actions">
  <button data-style-ornament="simple" class="btnCancel" (click)="close()">
    {{ 'COMPONENT.PLAYER_MANAGER.BACK' | transloco }}
  </button>
</div>
