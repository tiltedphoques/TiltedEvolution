@for (notification of notifications; track notification) {
  <p>
    <span class="app-notifications-icon"></span>
    @if (notification.senderName) {
      <span class="app-notifications-content"
        >{{ notification.senderName }}: {{ notification.content }}</span
      >
    }
    @if (!notification.senderName) {
      <span class="app-notifications-content">{{
        notification.content | transloco: notification.translationParams
      }}</span>
    }
  </p>
}
