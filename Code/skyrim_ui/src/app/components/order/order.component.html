<button class="sorting-button" (click)="sort()">
  @switch (order | async) {
    @case (SortOrder.ASC) {
      <fa-icon class="sorting-icon" [icon]="faCaretDown"></fa-icon>
    }
    @case (SortOrder.DESC) {
      <fa-icon class="sorting-icon" [icon]="faCaretUp"></fa-icon>
    }
    @case (SortOrder.NONE) {
      <fa-icon class="sorting-icon" [icon]="faSort"></fa-icon>
    }
  }
</button>
