<div
  *transloco="let t"
  class="notification-popup"
  (click)="clickNotification()"
  (mouseenter)="onEnter()"
  (mouseleave)="onLeave()"
>
  @if (notification.imageUrl) {
    <img [src]="notification.imageUrl" />
  }
  @if (notification.icon) {
    <div class="icon">
      <fa-icon [icon]="notification.icon"></fa-icon>
    </div>
  }
  <div class="content">
    <p>{{ t(notification.messageKey, notification.messageParams) }}</p>
    @if (notification.actions?.length) {
      <div class="actions">
        @for (action of notification.actions; track action) {
          <button (click)="action.callback()">
            {{ t(action.nameKey) }}
          </button>
        }
      </div>
    }
  </div>
  @if (duration !== 0) {
    <div class="expiration-line" [style.animation-duration.ms]="duration"></div>
  }
</div>
