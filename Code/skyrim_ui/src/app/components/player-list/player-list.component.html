<div
  class="no-players"
  *ngIf="(playerListLength$ | async) === 0; else notEmpty"
>
  <span>{{ 'COMPONENT.PARTY_LIST.NO_OTHER_PLAYERS' | transloco }}</span>
</div>

<ng-template #notEmpty>
  <div class="player-list">
    <table cellspacing="5" cellpadding="5" class="player-list-table">
      <thead class="list-header">
        <tr>
          <th>{{ 'COMPONENT.PARTY_LIST.TABLE_HEADERS.LEVEL' | transloco }}</th>
          <th>{{ 'COMPONENT.PARTY_LIST.TABLE_HEADERS.NAME' | transloco }}</th>
          <th></th>
        </tr>
      </thead>
      <tbody class="listBody">
        <tr *ngFor="let player of playerList$ | async">
          <td>{{ player.level }}</td>
          <td>{{ player.name }}</td>
          <td class="actions-col">
            <button
              [class.hidden]="player.isMember || !(isPartyLeader$ | async)"
              [disabled]="
                player.hasBeenInvited ||
                player.isMember ||
                !(isPartyLeader$ | async)
              "
              class="user-action-button"
              (click)="sendPartyInvite(player.id)"
            >
              {{ 'COMPONENT.PARTY_LIST.INVITE' | transloco }}
            </button>
            <ng-container *ngIf="!player.pendingInvite; else pendingTrade">
              <button
                type="button"
                class="user-action-button"
                (click)="sendTradeInvite(player.id)"
                [disabled]="player.tradeBusy"
              >
                {{ 'COMPONENT.PARTY_LIST.TRADE' | transloco }}
              </button>
            </ng-container>
            <ng-template #pendingTrade>
              <button
                type="button"
                class="user-action-button secondary"
                (click)="cancelTradeInvite(player.id)"
              >
                {{ 'COMPONENT.PARTY_LIST.CANCEL_TRADE_INVITE' | transloco }}
              </button>
            </ng-template>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</ng-template>
